name: Legacy Firebase deployment disabled

# This repository's old push job deployed all Functions and an obsolete public
# rules file. The apps share that Firebase project. Production releases now use
# reviewed, scoped commands from FINAL APP/release; no broad automatic redeploy.
on:
  workflow_dispatch:

jobs:
  release-information:
    runs-on: ubuntu-latest
    steps:
      - name: Require a reviewed scoped release
        run: echo "No production deployment performed. Use the reviewed scoped release checklist."
